function install(){document.getElementById('app').innerHTML=`<div class="app"><aside class="sidebar"><div class="brand"><img src="${LOGO}" alt="Logo ofisyèl APLS"><div><strong>APLS</strong><small>Jesyon asosyasyon<br>Lasal Sitwonye • Leyogàn</small></div></div><div class="navlabel">Administrasyon</div><div id="navlinks"></div><div class="sidebar-bottom"><div class="side-foot-logo">Inyon • Solidarite • Devlopman</div><p>Pwojè aplikasyon · vèsyon demonstrasyon</p></div></aside><div class="mobile-shade" onclick="closeSidebar()"></div><div class="workspace"><header class="topbar"><div class="firstrow"><button class="menu-open" aria-label="Louvri meni" onclick="toggleSidebar()">☰</button><div><div class="crumb">Asosyasyon Peyizan Lasal Sitwonye</div><div class="topname" id="pagetitle">Tablo jeneral</div></div></div><div class="toolbar"><span class="tag gold">DEMO • PA GEN SENKWONIZASYON</span><div class="avatar">A</div></div></header><main class="main"><section class="apls-demo-banner" role="status" aria-label="Avis sekirite demonstrasyon"><strong>VÈSYON TÈS</strong><span>Pa mete enfòmasyon pèsonèl oswa finansye reyèl. Done tès yo rete sou aparèy sa a; yo pa senkronize ant telefòn ak òdinatè.</span><a class="apls-install-link" href="./kijan_enstale.html" title="Enstriksyon iPhone, Android, ak òdinatè">Kijan pou enstale</a><button type="button" onclick="aplsClearTestData()" title="Retire tout done tès ki nan navigatè sa a">Efase done tès</button></section><div id="view"></div><div class="footer-note">APLS · Lasal Sitwonye, 9yèm seksyon kominal Leyogàn, Ayiti · Inyon • Solidarite • Devlopman</div></main></div></div><nav class="mobile-tabs" aria-label="Aksè rapid APLS"><button class="mobile-tab active" type="button" data-page="dashboard" onclick="setPage('dashboard')"><span class="tab-symbol">⌂</span>Akèy</button><button class="mobile-tab" type="button" data-page="members" onclick="setPage('members')"><span class="tab-symbol">♙</span>Manm</button><button class="mobile-tab" type="button" data-page="meetings" onclick="setPage('meetings')"><span class="tab-symbol">▤</span>Reyinyon</button><button class="mobile-tab" type="button" data-page="finance" onclick="setPage('finance')"><span class="tab-symbol">◈</span>Finans</button><button class="mobile-tab" type="button" data-page="projects" onclick="setPage('projects')"><span class="tab-symbol">◉</span>Pwojè</button></nav><div id="modalhost"></div>`;render()}
function render(){if(!document.getElementById('view'))return;document.getElementById('navlinks').innerHTML=NAV.map(x=>`<button class="navbutton ${page===x[0]?'active':''}" onclick="setPage('${x[0]}')"><span class="ico">${x[1]}</span><span>${x[2]}</span></button>`).join('');document.getElementById('pagetitle').textContent=NAV.find(i=>i[0]===page)?.[2]||'APLS';const routes={dashboard:dashboard,members:membersView,committee:committeeView,meetings:meetingsView,forms:formsView,finance:financeView,projects:projectsView,assets:assetsView,elections:electionsView,complaints:complaintsView,partners:partnersView,rules:rulesView,founder:founderView,reports:reportsView,settings:settingsView};document.getElementById('view').innerHTML=routes[page]();document.querySelectorAll('.mobile-tab').forEach(el=>{const active=el.dataset.page===page;el.classList.toggle('active',active);el.setAttribute('aria-current',active?'page':'false')});}
function section(title,desc,buttons=''){return `<div class="sectionhead"><div><h2>${title}</h2><p class="subtitle">${desc}</p></div>${buttons?`<div class="actions">${buttons}</div>`:''}</div>`}
function b(text,call,kind='primary'){return `<button class="btn ${kind}" onclick="${call}">${text}</button>`}
function empty(icon,title,desc){return `<div class="empty"><span style="font-size:28px">${icon}</span><b>${title}</b><span>${desc}</span></div>`}
function table(headers,rows,blank){return rows.length?`<div class="table-wrap"><table><thead><tr>${headers.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.join('')}</tbody></table></div>`:blank}
function newActivity(text){db.logs.unshift({date:now(),text});db.logs=db.logs.slice(0,80)}
function hero(){return `<div class="hero"><div class="hero-text"><div class="eyebrow">Espas administrasyon • APLS</div><h1>Ansanm nou bati yon kominote pi solid.</h1><p>Sistèm jesyon manm, Komite Direktè, reyinyon, resous ak pwojè pou devlopman Lasal Sitwonye.</p><button class="btn hero-btn" onclick="openMember()">✚ Nouvo enskripsyon</button></div><img src="${LOGO}" alt="APLS"></div>`}
function dashboard(){let approved=db.members.filter(x=>x.status==='Aktif').length,pending=db.members.filter(x=>x.status==='An atant').length,activeProjects=db.projects.filter(x=>x.status==='An kou').length,exec=db.appointments.filter(x=>x.status==='Aktif').length;let upcoming=db.meetings.filter(x=>x.date>=today()&&x.status==='Pwograme').sort((a,b)=>a.date.localeCompare(b.date)).slice(0,3);return `<div class="stack">${hero()}<div class="notice"><b>Vèsyon demonstrasyon:</b> done yo rete sèlman nan navigatè kote ou ouvri fichye a. Pa antre enfòmasyon reyèl oswa plent konfidansyèl avan yon vèsyon ak otantifikasyon, backup sekirize ak baz done pwoteje disponib. Règleman 179 atik la toujou se yon <b>pwojè pou apwobasyon</b>.</div><div class="grid4"><div class="stat"><span class="bubble">♙</span><div class="statname">Manm anrejistre</div><div class="statnum">${db.members.length}</div><div class="statfoot">${pending} ap tann egzamen</div></div><div class="stat"><span class="bubble">✓</span><div class="statname">Manm aktif</div><div class="statnum">${approved}</div><div class="statfoot">Estati administratif sèlman</div></div><div class="stat"><span class="bubble">♜</span><div class="statname">Pòs komite ranpli</div><div class="statnum">${exec}<span style="font-size:14px;color:#859388"> / 13</span></div><div class="statfoot">Modèl 13 pòs pou valide</div></div><div class="stat"><span class="bubble">◉</span><div class="statname">Pwojè an kou</div><div class="statnum">${activeProjects}</div><div class="statfoot">${db.projects.length} dosye pwojè</div></div></div><div class="grid2"><div class="panel"><div class="panelhead"><div><h3>Aksyon rapid</h3><p class="subtitle">Travay sekretarya ak komite a itilize pi souvan</p></div></div><div class="grid2" style="gap:10px"><button class="btn outline" onclick="openMember()">♙ Enskri yon manm</button><button class="btn outline" onclick="openMeeting()">▤ Kreye reyinyon</button><button class="btn outline" onclick="openPayment()">◈ Anrejistre resi</button><button class="btn outline" onclick="openProject()">◉ Nouvo pwojè</button></div><div style="margin-top:20px" class="notice green"><b>Prensip APLS:</b> yon demann enskripsyon pa vle di manm nan apwouve; yon kotizasyon pa bay dwa vote otomatikman. Se estati ak rezolisyon ki valab ki detèmine dwa yo (atik 6, 13, 85).</div></div><div class="panel"><div class="panelhead"><div><h3>Reyinyon k ap vini</h3><p class="subtitle">Pwogram Komite ak Asanble a</p></div>${b('Wè tout','setPage(\'meetings\')','outline')}</div>${upcoming.length?upcoming.map(m=>`<div class="feature"><div class="feature-ico">▤</div><div><h4>${txt(m.title)}</h4><p>${txt(m.date)} · ${txt(m.location)}<br>${txt(m.type)}</p></div></div>`).join(''):empty('🗓','Pa gen reyinyon pwograme','Ajoute yon reyinyon ansanm ak ajanda ak kote li.')}</div></div><div class="grid2"><div class="panel"><div class="panelhead"><div><h3>Aktivite ki sot fèt</h3><p class="subtitle">Istwa aksyon ki fèt sou navigatè sa a</p></div></div>${db.logs.length?db.logs.slice(0,5).map(x=>`<div class="activity"><span class="dot"></span><div><div>${txt(x.text)}</div><div class="mini" style="margin-top:5px">${txt(x.date)}</div></div></div>`).join(''):empty('◷','Poko gen aktivite','Lè ou kòmanse itilize aplikasyon an, aktivite ou yo ap parèt isit la.')}</div><div class="panel"><div class="panelhead"><div><h3>Distribisyon manm</h3><p class="subtitle">Estati dosye admisyon yo</p></div></div>${['Aktif','An atant','Sispann','Rejte'].map(s=>{let q=db.members.filter(x=>x.status===s).length;return `<div class="barline"><div class="barname">${s}</div><div class="bar"><span style="width:${db.members.length?(q/db.members.length*100):0}%"></span></div><div class="count">${q}</div></div>`}).join('')}<div style="margin-top:18px" class="statusrow"><span class="pill-note">Règleman: 179 atik</span><span class="pill-note">20 chapit</span><span class="pill-note">16 anèks</span></div></div></div><div class="panel"><div class="firstrow"><div class="symbol">★</div><div style="flex:1"><b>Joseph Wilner Delisca</b><div class="fine">Fondatè APLS — espas prezantasyon ofisyèl pou òganizasyon an</div></div>${b('Konnen APLS','setPage(\'founder\')','outline')}</div></div></div>`}
function membersView(){let q=searchText.toLowerCase(),data=db.members.filter(x=>(!q||[x.first,x.last,x.number,x.phone,x.zone,x.email].join(' ').toLowerCase().includes(q))&&(searchStatus==='Tout'||x.status===searchStatus));return `<div class="stack">${section('Manm ak demann enskripsyon','Enskri, verifye, apwouve ak suiv manm yo. Tout demann kòmanse kòm « An atant ».',b('✚ Nouvo manm','openMember()')+b('🖨 Fòm vid','printBlankRegistration()','outline')+b('⬇ CSV','exportCsv(\'members\')','outline'))}<div class="grid4"><div class="stat"><div class="statname">Total</div><div class="statnum">${db.members.length}</div></div><div class="stat"><div class="statname">Aktif</div><div class="statnum">${db.members.filter(m=>m.status==='Aktif').length}</div></div><div class="stat"><div class="statname">An atant</div><div class="statnum">${db.members.filter(m=>m.status==='An atant').length}</div></div><div class="stat"><div class="statname">Rejete / sispann</div><div class="statnum">${db.members.filter(m=>['Rejte','Sispann'].includes(m.status)).length}</div></div></div><div class="panel"><div class="search-row"><input id="search" value="${eatt(searchText)}" oninput="filterSearch(this.value)" placeholder="Chèche non, kòd manm, lokalite oswa telefòn"><select id="memberfilter" onchange="filterStatus(this.value)">${['Tout','An atant','Aktif','Sispann','Rejte'].map(s=>`<option ${searchStatus===s?'selected':''}>${s}</option>`).join('')}</select></div>${table(['Kòd','Non konplè','Lokalite','Dat demann','Estati','Aksyon'],data.map(m=>`<tr><td><span class="code">${txt(m.number)}</span></td><td><strong>${esc(fullName(m))}</strong><div class="sub">${txt(m.phone)}</div></td><td>${txt(m.zone)}</td><td>${txt(m.joined)}</td><td>${status(m.status)}</td><td><div class="inline-actions"><button class="linkbtn" onclick="openMember('${m.id}')">Edit</button><button class="linkbtn" onclick="printRegistration('${m.id}')">Fich</button>${m.status==='An atant'?`<button class="linkbtn" onclick="updateMemberStatus('${m.id}','Aktif')">Apwouve</button>`:''}</div></td></tr>`),empty('♙','Pa gen manm nan lis sa a','Sèvi ak bouton Nouvo manm pou ranpli yon fich enskripsyon.'))}</div><div class="notice green"><b>Pwosedi:</b> anrejistre demann → verifye kondisyon nan estati APLS → pran desizyon admisyon → dokimante desizyon an. Pa konfonn « manm aktif » ak « elektè kalifye » san lis elektoral apwouve (atik 13, 19, 61).</div></div>`}
function filterSearch(t){let e=document.getElementById('search');let a=e?.selectionStart;searchText=t;render();let f=document.getElementById('search');if(f){f.focus();f.setSelectionRange(a,a)}}
function filterStatus(s){searchStatus=s;render()}
function committeeView(){let roles=POSITIONS.map((pos,i)=>{let a=db.appointments.find(x=>x.position===pos&&x.status==='Aktif');return `<div class="position"><div class="firstrow"><span class="num">${String(i+1).padStart(2,'0')}</span><div><div class="position-title">${pos}</div><div class="position-sub">${a?esc(a.memberName)+' · '+esc(a.start||'')+' → '+esc(a.end||''): 'Pòs pou ranpli / konfime'}</div></div></div><button class="btn small outline" onclick="openAppointment('${i}')">${a?'Chanje':'Deziyen'}</button></div>`}).join('');return `<div class="stack">${section('Komite Direktè ak komisyon','Responsablite yo, manm eli yo, manda, pasasyon ak siveyans endepandan.')}<div class="notice"><b>Atik 17–21:</b> dokiman an pwopoze yon komite 13 pòs ak manda modèl 2 lane. Sa se pa yon apwobasyon; Asanble a dwe valide kantite pòs, manda yo ak eleksyon yo. Non fondatè a pa bay yon pòs oswa dwa veto otomatikman (atik 16).</div><div class="grid4"><div class="stat"><div class="statname">Pòs egzekitif</div><div class="statnum">13</div><div class="statfoot">Modèl pwopoze</div></div><div class="stat"><div class="statname">Pòs ranpli</div><div class="statnum">${db.appointments.filter(x=>x.status==='Aktif').length}</div></div><div class="stat"><div class="statname">Siveyans</div><div class="statnum">${db.oversight.filter(x=>x.status==='Aktif').length} <span style="font-size:14px">/ 3</span></div></div><div class="stat"><div class="statname">Manda pase dat</div><div class="statnum">${db.appointments.filter(x=>x.status==='Aktif'&&x.end&&x.end<today()).length}</div></div></div><div class="panel"><div class="panelhead"><div><h3>13 pòs yo</h3><p class="subtitle">Deziyasyon egzije yon referans pwosèvèbal oswa rezolisyon.</p></div></div><div class="grid2">${roles}</div></div><div class="panel"><div class="panelhead"><div><h3>Komisyon Siveyans</h3><p class="subtitle">3 manm endepandan ki pa dwe fè pati egzekitif la (atik 41–44).</p></div>${b('✚ Manm siveyans','openOversight()')}</div>${table(['Manm','Kòmansman','Finisman','PV / rezolisyon','Estati'],db.oversight.map(x=>`<tr><td>${txt(x.memberName)}</td><td>${txt(x.start)}</td><td>${txt(x.end)}</td><td>${txt(x.reference)}</td><td>${status(x.status)}</td></tr>`),empty('♧','Pa gen manm siveyans','Komisyon an dwe eli oswa valide pa ògàn konpetan an.'))}</div></div>`}
function meetingsView(){let data=[...db.meetings].sort((a,b)=>b.date.localeCompare(a.date));return `<div class="stack">${section('Reyinyon ak pwosèvèbal','Ajanda, dat, konvokasyon, prezans, rezolisyon ak swivi desizyon.',b('✚ Planifye reyinyon','openMeeting()'))}<div class="notice green"><b>Atik 48–59:</b> reyinyon òdinè Komite a omwen yon fwa pa mwa; avi pwopoze 5 jou davans, eksepte ijans. Pou modèl 13 manm ranpli yo, dokiman an endike kowòm 7, men aplikasyon an pa sètifye validite okenn vòt.</div><div class="panel">${table(['Dat','Reyinyon','Kote','Prezans','PV / rezolisyon','Estati','Aksyon'],data.map(x=>`<tr><td><strong>${txt(x.date)}</strong></td><td>${txt(x.title)}<div class="sub">${txt(x.type)}</div></td><td>${txt(x.location)}</td><td>${txt(x.attendance)} / ${txt(x.expected)}</td><td>${txt(x.reference)}</td><td>${status(x.status)}</td><td><button class="linkbtn" onclick="openMeeting('${x.id}')">Edit</button></td></tr>`),empty('▤','Poko gen reyinyon','Planifye premye rankont APLS la epi konsève ajanda li.'))}</div></div>`}
function financeView(){const incomes=db.payments.filter(x=>x.flow==='Antre'&&x.status==='Resevwa');const expenses=db.payments.filter(x=>x.flow==='Sòti'&&x.status==='Peye');const htgIn=sum(incomes,x=>x.currency==='HTG'),htgOut=sum(expenses,x=>x.currency==='HTG');return `<div class="stack">${section('Finans ak kotizasyon','Resi, don, kotizasyon, depans ak tras apwobasyon.',b('✚ Antre / depans','openPayment()')+b('⬇ CSV','exportCsv(\'payments\')','outline'))}<div class="grid4"><div class="stat"><div class="statname">Antre HTG</div><div class="statnum" style="font-size:22px">${Number(htgIn).toLocaleString('fr-FR')}</div><div class="statfoot">Peman konfime sèlman</div></div><div class="stat"><div class="statname">Depans HTG</div><div class="statnum" style="font-size:22px">${Number(htgOut).toLocaleString('fr-FR')}</div></div><div class="stat"><div class="statname">Balans HTG</div><div class="statnum" style="font-size:22px">${Number(htgIn-htgOut).toLocaleString('fr-FR')}</div></div><div class="stat"><div class="statname">Kotizasyon ki fikse</div><div class="statnum" style="font-size:22px">${db.config.annualDues?fmtMoney(db.config.annualDues):'Pa fikse'}</div><div class="statfoot">Se rezolisyon ki dwe fikse l</div></div></div><div class="notice"><b>Atik 81–95:</b> trezorye a pa dwe apwouve, peye ak verifye menm tranzaksyon an poukont li. Nan demonstrasyon sa a, ou ka anrejistre etap yo, men pa gen siyati dijital, tranzaksyon bankè, oswa otantifikasyon moun ki apwouve yo.</div><div class="panel">${table(['Resi / kòd','Dat','Nati','Manm / sous','Montan','Estati','Aksyon'],[...db.payments].reverse().map(x=>`<tr><td class="code">${txt(x.receipt)}</td><td>${txt(x.date)}</td><td>${txt(x.category)}<div class="sub">${txt(x.flow)}</div></td><td>${txt(x.party)}</td><td><strong>${fmtMoney(x.amount,x.currency)}</strong></td><td>${status(x.status)}</td><td><div class="inline-actions"><button class="linkbtn" onclick="openPayment('${x.id}')">Edit</button>${x.flow==='Antre'&&x.status==='Resevwa'?`<button class="linkbtn" onclick="printReceipt('${x.id}')">Resi</button>`:''}</div></td></tr>`),empty('◈','Pa gen tranzaksyon','Antre premye kotizasyon, don oswa depans tès la.'))}</div></div>`}
function projectsView(){return `<div class="stack">${section('Pwojè kominotè','Planifye travay agrikòl, edikatif, sosyal, ekonomik, kiltirèl ak anviwònmantal.',b('✚ Nouvo pwojè','openProject()'))}<div class="grid3">${db.projects.map(p=>`<div class="cardline"><div class="statusrow">${status(p.status)}<span class="pill-note">${txt(p.sector)}</span></div><h4 style="font-size:17px;margin-top:16px">${txt(p.title)}</h4><p>${txt(p.description)}</p><p><strong>Kote:</strong> ${txt(p.location)}<br><strong>Responsab:</strong> ${txt(p.owner)}<br><strong>Bidjè:</strong> ${p.budget?fmtMoney(p.budget,p.currency):'Pa fikse'}<br><strong>Dat:</strong> ${txt(p.start)} → ${txt(p.end)}</p><button class="btn small outline" onclick="openProject('${p.id}')">Revize pwojè</button></div>`).join('')||empty('◉','Pa gen pwojè','Ajoute yon pwojè ak objektif, zòn, bidjè ak swivi (atik 106–117).')}</div></div>`}
function assetsView(){return `<div class="stack">${section('Rejis byen ak envantè','Materyèl, ekipman, valè, kote, responsab ak kondisyon byen yo.',b('✚ Ajoute yon byen','openAsset()'))}<div class="panel">${table(['Kòd byen','Deskripsyon','Kote','Responsab','Valè','Kondisyon','Aksyon'],db.assets.map(x=>`<tr><td class="code">${txt(x.code)}</td><td>${txt(x.name)}</td><td>${txt(x.location)}</td><td>${txt(x.owner)}</td><td>${x.value?fmtMoney(x.value,x.currency):'—'}</td><td>${status(x.condition)}</td><td><button class="linkbtn" onclick="openAsset('${x.id}')">Edit</button></td></tr>`),empty('▣','Pa gen byen anrejistre','Kreye kòd envantè pou chak materyèl oswa ekipman APLS posede.'))}</div></div>`}
function electionsView(){return `<div class="stack">${section('Eleksyon, kandidati ak manda','Kalandriye, lis elektoral ak pwosèvèbal rezilta.',b('✚ Dosye eleksyon','openElection()'))}<div class="notice"><b>Atik 60–66:</b> komisyon elektoral la dwe endepandan. Fòm sa a konsève dosye, li pa deside kalifikasyon elektè, pa fè vòt sekrè sou entènèt, epi li pa pwoklame rezilta otomatikman.</div><div class="panel">${table(['Dat','Eleksyon / ògàn','Pòs / objektif','Responsab','PV','Estati','Aksyon'],db.elections.map(x=>`<tr><td>${txt(x.date)}</td><td><strong>${txt(x.title)}</strong></td><td>${txt(x.position)}</td><td>${txt(x.owner)}</td><td>${txt(x.reference)}</td><td>${status(x.status)}</td><td><button class="linkbtn" onclick="openElection('${x.id}')">Edit</button></td></tr>`),empty('☷','Poko gen eleksyon','Prepare premye kalandriye elektoral la apre validasyon estati yo.'))}</div></div>`}
function complaintsView(){return `<div class="stack">${section('Plent, etik ak medyasyon','Rejis pwosedi pou resevwa, klase ak swiv plent nan respè konfidansyalite.',b('✚ Nouvo dosye tès','openComplaint()'))}<div class="notice red"><b>Done trè sansib:</b> modil demonstrasyon sa a pa gen sekirite, ni kont prive ni chifreman. Pa antre non denonsyatè, detay vyolans, done timoun oswa enfòmasyon konfidansyèl reyèl. Pou pwodiksyon, plent yo dwe nan yon espas izole kote sèlman moun otorize gen aksè (atik 139–140, 155–164).</div><div class="panel">${table(['Kòd','Dat','Kategori','Rezime ki pa sansib','Responsab','Estati'],db.complaints.map(x=>`<tr><td class="code">${txt(x.code)}</td><td>${txt(x.date)}</td><td>${txt(x.category)}</td><td>${txt(x.summary)}</td><td>${txt(x.owner)}</td><td>${status(x.status)}</td></tr>`),empty('♧','Pa gen dosye tès','Plent reyèl yo mande yon sistèm sekirize apa.'))}</div></div>`}
function partnersView(){return `<div class="stack">${section('Patnè, kontak ak korespondans','Enstitisyon piblik, ONG, donatè, asosyasyon ak antant fòmèl.',b('✚ Nouvo patnè','openPartner()'))}<div class="panel">${table(['Òganizasyon','Kalite','Kontak','Dosye / akò','Estati','Aksyon'],db.partners.map(x=>`<tr><td><strong>${txt(x.name)}</strong></td><td>${txt(x.type)}</td><td>${txt(x.contact)}</td><td>${txt(x.reference)}</td><td>${status(x.status)}</td><td><button class="linkbtn" onclick="openPartner('${x.id}')">Edit</button></td></tr>`),empty('◇','Pa gen patnè','Anrejistre kontak ofisyèl ak referans akò yo.'))}</div><div class="notice green">Komite a dwe gen otorizasyon pou reprezante APLS ak siyen dokiman pou li (atik 148–154).</div></div>`}
function rulesView(){let data=RULES.articles.filter(x=>!ruleSearch||(`${x.number} ${x.title} ${x.text} ${x.chapter}`).toLowerCase().includes(ruleSearch.toLowerCase()));return `<div class="stack">${section('Règleman Entèn APLS','179 atik • 20 chapit • 16 anèks. Tèks pwojè vèsyon 2.3 (18 oktòb 2026).')}<div class="notice"><b>Pwojè pou apwobasyon:</b> sitasyon sa yo ede moun jwenn règ yo, men yo pa fè yo vin lwa oswa règ deja adopte. Yo dwe verifye avèk estati ak rezolisyon APLS ki valab.</div><div class="panel"><div class="search-row"><input id="rulesearch" placeholder="Chèche yon atik, pa egzanp: kotizasyon, reyinyon, eleksyon, plent" value="${eatt(ruleSearch)}" oninput="filterRules(this.value)"><span class="pill-note">${data.length} rezilta</span></div><div class="rules">${data.map(a=>`<article class="rule" onclick="showRule(${a.number})"><span class="code">ATIK ${a.number}</span><h4>${txt(a.title)}</h4><p>${txt(a.text.slice(0,178))}${a.text.length>178?'…':''}</p></article>`).join('')||empty('⌕','Pa gen rezilta','Eseye yon lòt mo oswa nimewo atik.')}</div></div></div>`}
function filterRules(t){const p=document.getElementById('rulesearch'),a=p?.selectionStart;ruleSearch=t;render();const x=document.getElementById('rulesearch');x?.focus();try{x?.setSelectionRange(a,a)}catch(e){}}
function showRule(n){let a=RULES.articles.find(x=>x.number===n);openModal(`Atik ${n} — ${esc(a.title)}`,`<p class="subtitle">${txt(a.chapter)}</p><p style="font-size:14px;line-height:1.85">${txt(a.text)}</p><div class="notice">Dokiman sous: Règleman Entèn APLS, pwojè pou apwobasyon — vèsyon 2.3.</div>`,null)}
function founderView(){return `<div class="stack">${section('Fondatè ak prezantasyon APLS','Idantite òganizasyon an, misyon li, valè li ak referans fondatè a.')}<div class="founder"><div class="round">JW</div><div><div class="eyebrow" style="color:#598469">Fondatè Asosyasyon an</div><h2>Joseph Wilner Delisca</h2><p>Prezantasyon fondatè <strong>Asosyasyon Peyizan Lasal Sitwonye (APLS)</strong>. Espas sa a ka resevwa biyografi, foto, kontribisyon nan kreyasyon asosyasyon an ak mesaj fondatè a apre òganizasyon an fin verifye epi apwouve enfòmasyon yo.</p><div class="quote">Inyon • Solidarite • Devlopman</div></div></div><div class="grid2"><div class="panel"><div class="panelhead"><h3>Ki sa APLS ye?</h3></div><p class="fine" style="font-size:13px">APLS vle di <b>Asosyasyon Peyizan Lasal Sitwonye</b>. Li se yon inisyativ kominotè ki vize devlopman Lasal Sitwonye, 9yèm seksyon kominal Leyogàn, Ayiti. Travay li pa limite ak agrikilti: li konsène ekonomi, edikasyon, sante, anviwònman, dlo, kilti, enfrastrikti ak patisipasyon kominotè.</p><img src="${LOGO}" alt="Logo APLS" style="height:130px;display:block;margin:24px auto 4px"></div><div class="panel"><div class="panelhead"><h3>Prensip administrasyon</h3></div>${[['♙','Patisipasyon manm','Dwa, devwa ak mekanis pou pote kestyon bay Asanble Jeneral la.'],['♜','Komite Direktè','Responsablite depann de eleksyon, manda ak pwosèvèbal apwouve.'],['♧','Siveyans endepandan','Komisyon Siveyans ak pwosedi etik pou kontwòl ak rann kont.'],['★','Wòl fondatè','Tit fondatè a se yon rekonesans istorik; li pa bay yon pouvwa otomatik (atik 16).']].map(x=>`<div class="feature"><div class="feature-ico">${x[0]}</div><div><h4>${x[1]}</h4><p>${x[2]}</p></div></div>`).join('')}</div></div><div class="notice green"><b>Pwoteksyon enfòmasyon:</b> pa ajoute dat nesans, istwa pèsonèl, foto oswa deklarasyon sou Joseph Wilner Delisca san verifikasyon ak konsantman apwopriye. Non fondatè a soti nan enfòmasyon moun ki mande aplikasyon an bay.</div></div>`}
function reportsView(){return `<div class="stack">${section('Rapò ak ekspòtasyon','Swiv aktivite APLS epi fè kopi done tès ou yo.')}<div class="grid4"><div class="stat"><div class="statname">Manm</div><div class="statnum">${db.members.length}</div></div><div class="stat"><div class="statname">Reyinyon</div><div class="statnum">${db.meetings.length}</div></div><div class="stat"><div class="statname">Pwojè</div><div class="statnum">${db.projects.length}</div></div><div class="stat"><div class="statname">Peman</div><div class="statnum">${db.payments.length}</div></div></div><div class="grid2"><div class="panel"><h3>Ekspòte lis yo</h3><p class="fine">CSV fasil pou ouvri nan Excel, Google Sheets oswa lòt lojisyèl jesyon.</p><div class="actions" style="margin-top:19px">${b('Manm CSV',`exportCsv('members')`,'outline')}${b('Finans CSV',`exportCsv('payments')`,'outline')}${b('Reyinyon CSV',`exportCsv('meetings')`,'outline')}${b('Pwojè CSV',`exportCsv('projects')`,'outline')}</div></div><div class="panel"><h3>Sovgad demonstrasyon an</h3><p class="fine">Telechaje tout done yo kòm JSON. Fichye sa a pa chiffre: konsève l yon kote ki pwoteje.</p><div class="actions" style="margin-top:19px">${b('⬇ Telechaje backup JSON','exportBackup()')}${b('↥ Enpòte backup','document.getElementById(\'importFile\').click()','outline')}<input type="file" id="importFile" accept=".json,application/json" onchange="importBackup(this)" style="display:none"></div></div></div><div class="panel"><h3>Sa ki rete pou yon vèsyon ofisyèl sou entènèt</h3><div class="grid2">${[['🔐','Kont ak pèmisyon','Kreye kont admin, sekretarya, trezorye, Komisyon Siveyans ak manm òdinè.'],['☁','Sèvè ak backup','Baz done chifre, kopi otomatik, tras odit ki pa ka modifye.'],['📩','Pòtay manm','Manm yo ranpli demann adistans epi resevwa konfimasyon.'],['🧾','Finans verifyab','Siyati, resi sekirize, doub apwobasyon ak rekonsilyasyon.']].map(x=>`<div class="feature"><div class="feature-ico">${x[0]}</div><div><h4>${x[1]}</h4><p>${x[2]}</p></div></div>`).join('')}</div></div></div>`}
function settingsView(){return `<div class="stack">${section('Paramèt APLS','Règleman finansye ak enfòmasyon jeneral yo dwe sòti nan rezolisyon ki apwouve.')}<div class="panel" style="max-width:820px"><form onsubmit="saveSettings(event)" class="formgrid"><div class="field"><label>Montan kotizasyon (HTG)</label><input name="annualDues" type="number" min="0" step="0.01" value="${eatt(db.config.annualDues)}" placeholder="Pa fikse"><div class="hint">Pa fikse tarif san vòt valab (atik 85).</div></div><div class="field"><label>Plafon depans referans (HTG)</label><input name="financeThreshold" type="number" min="0" step="0.01" value="${eatt(db.config.financeThreshold)}" placeholder="Pa fikse"><div class="hint">Montan sa a bezwen rezolisyon nan Anèks B.</div></div><div class="field full"><label>Kontak piblik APLS (telefòn oswa imèl)</label><input name="contact" value="${eatt(db.config.contact)}" placeholder="Apre verifikasyon"></div><div class="field"><label>Dat apwobasyon règleman (si gen PV)</label><input name="acceptedOn" type="date" value="${eatt(db.config.acceptedOn)}"></div><div class="field"><label>Estati règleman</label><select name="reglementApproved"><option value="false" ${db.config.reglementApproved?'':'selected'}>Pwojè pou apwobasyon</option><option value="true" ${db.config.reglementApproved?'selected':''}>Apwouve selon PV Asanble</option></select><div class="hint">Pa chanje sa san yon pwosèvèbal Asanble ki valab.</div></div><div class="field full"><label>Referans PV apwobasyon règleman</label><input name="approvalReference" value="${eatt(db.config.approvalReference)}" placeholder="Rezolisyon / pwosèvèbal Asanble"></div><div class="field full"><button class="btn primary" type="submit">Anrejistre paramèt yo</button></div></form></div><div class="notice red"><b>Efase done tès yo:</b> aksyon sa a pa ka retounen san backup. <button class="btn danger small" style="margin-left:12px" onclick="clearData()">Efase tout done demonstrasyon</button></div></div>`}
function saveSettings(ev){ev.preventDefault();const a=Object.fromEntries(new FormData(ev.target));if(a.reglementApproved==='true'&&(!a.acceptedOn||!a.approvalReference?.trim())){notify('Pou make règleman kòm apwouve, fòk dat ak referans PV Asanble a prezan.',true);return}db.config={...db.config,...a,reglementApproved:a.reglementApproved==='true'};save('Paramèt òganizasyon an modifye');notify('Paramèt yo anrejistre lokalman')}
function clearData(){if(confirm('Èske ou vle efase TOUT done ki sou navigatè sa a? Fè backup anvan.')){db=defaults();save('Baz done demonstrasyon an reset');notify('Tout done tès yo efase')}}
let pending=null;
function openModal(title,body,foot){document.getElementById('modalhost').innerHTML=`<div class="modal-scrim" onclick="if(event.target===this)closeModal()"><div class="modal" role="dialog" aria-modal="true" aria-label="${eatt(title)}"><div class="modal-top"><h2>${title}</h2><button class="modal-x" onclick="closeModal()" aria-label="Fèmen">×</button></div><div class="modal-body">${body}</div>${foot===null?'':`<div class="modal-bottom">${foot||b('Fèmen','closeModal()','outline')}</div>`}</div></div>`}
function closeModal(){document.getElementById('modalhost').innerHTML='';pending=null}
function field(name,label,value='',opts={}){let req=opts.required?'required':'';let hint=opts.hint?`<div class="hint">${esc(opts.hint)}</div>`:'';let markup='';if(opts.options){let arr=opts.options;markup=`<select name="${name}" ${req}>${arr.map(op=>{let x=typeof op==='string'?{value:op,label:op}:op;return `<option value="${eatt(x.value)}" ${String(value??'')===String(x.value)?'selected':''}>${esc(x.label)}</option>`}).join('')}</select>`}else if(opts.area){markup=`<textarea name="${name}" ${req} placeholder="${eatt(opts.placeholder||'')}">${esc(value)}</textarea>`}else{markup=`<input name="${name}" type="${opts.type||'text'}" ${req} ${opts.min!=null?`min="${opts.min}"`:''} ${opts.step?`step="${opts.step}"`:''} value="${eatt(value||'')}" placeholder="${eatt(opts.placeholder||'')}">`}return `<div class="field ${opts.full?'full':''}"><label>${esc(label)}${opts.required?' *':''}</label>${markup}${hint}</div>`}
function formModal(title,formBody,kind,recordId){pending={kind,recordId};openModal(esc(title),`<form id="recordform" onsubmit="submitRecord(event)"><div class="formgrid">${formBody}</div></form>`,`<button class="btn outline" onclick="closeModal()">Anile</button><button class="btn primary" type="submit" form="recordform">Anrejistre</button>`)}
function assignRecord(collection,recordId,obj){let r=db[collection];if(recordId){let x=r.find(z=>z.id===recordId);if(!x)throw Error('Dosye sa pa egziste');Object.assign(x,obj);return x}let x={id:id(collection),...obj};r.push(x);return x}
function getObj(k,id){return db[k].find(z=>z.id===id)||{}}
function memberOptions(value='',onlyActive=true){return [{value:'',label:'Chwazi yon manm'},...db.members.filter(x=>!onlyActive||x.status==='Aktif').map(x=>({value:x.id,label:`${fullName(x)} (${x.number})`}))]}
function openMember(i){const r=getObj('members',i);let body=field('first','Prenon',r.first,{required:true,placeholder:'Egzanp: Marie'})+field('last','Non fanmi',r.last,{required:true,placeholder:'Egzanp: Pierre'})+field('phone','Telefòn',r.phone,{type:'tel'})+field('email','Imèl (opsyonèl)',r.email,{type:'email'})+field('zone','Lokalite / abitasyon',r.zone,{required:true,placeholder:'Lasal Sitwonye'})+field('address','Adrès kontak (opsyonèl)',r.address)+field('occupation','Aktivite / pwofesyon',r.occupation)+field('interest','Domen enterè',r.interest,{options:['Agrikilti','Edikasyon','Sante','Ekonomi','Anviwònman','Kilti','Enfrastrikti','Plizyè domèn','Lòt']})+field('joined','Dat demann enskripsyon',r.joined||today(),{type:'date',required:true})+field('status','Estati demann',r.status||'An atant',{options:i?['An atant','Aktif','Sispann','Rejte']:['An atant'],hint:'Admisyon dwe verifye anvan w chanje estati.'})+field('reference','Referans desizyon / PV admisyon',r.reference,{full:true,placeholder:'Si dosye a apwouve'})+field('notes','Nòt administratif',r.notes,{area:true,full:true,placeholder:'Pa mete detay pèsonèl ki pa nesesè'})+`<div class="field full"><label class="checkline"><input type="checkbox" name="consent" value="yes" ${r.consent?'checked':''} required> Moun nan bay konsantman pou APLS itilize enfòmasyon kontak sa yo pou jesyon manm, jan règleman ak politik vi prive òganizasyon an pèmèt li. *</label><div class="hint">Pa mande nimewo idantifikasyon leta oswa enfòmasyon sante nan demonstrasyon sa a.</div></div>`;formModal(i?'Modifye fich manm':'Fòm enskripsyon manm APLS',body,'members',i)}
function updateMemberStatus(memberId,statusValue){let r=getObj('members',memberId);let reference=prompt(`Referans desizyon admisyon pou ${fullName(r)} (PV oubyen rezolisyon obligatwa):`);if(reference===null)return;if(!reference.trim()){notify('Fòk gen yon referans desizyon pou admisyon.',true);return}r.status=statusValue;r.reference=reference.trim();save('Admisyon '+fullName(r)+' → '+statusValue);notify('Estati manm nan ajou')}
function openAppointment(num){let position=POSITIONS[Number(num)];let a=db.appointments.find(x=>x.position===position&&x.status==='Aktif')||{};let bdy=`<div class="field full"><label>Pòs</label><input readonly value="${eatt(position)}" name="position"></div>`+field('memberId','Manm eli oswa deziyen',a.memberId,{options:memberOptions(a.memberId),required:true})+field('start','Dat kòmansman manda',a.start||today(),{type:'date',required:true})+field('end','Dat finisman manda',a.end,{type:'date',required:true})+field('reference','Referans PV / rezolisyon Asanble',a.reference,{required:true,full:true,hint:'Yon pòs pa ka ranpli san yon desizyon otorize.'})+field('notes','Nòt / pasasyon',a.notes,{area:true,full:true});formModal('Deziyasyon: '+position,bdy,'appointments',a.id)}
function openOversight(){let body=field('memberId','Manm Komisyon Siveyans', '',{options:memberOptions(),required:true})+field('start','Dat kòmansman',today(),{type:'date',required:true})+field('end','Dat fen manda','',{type:'date',required:true})+field('reference','PV eleksyon / rezolisyon','',{required:true,full:true});formModal('Manm Komisyon Siveyans',body,'oversight',null)}
function openMeeting(i){let x=getObj('meetings',i);let body=field('title','Tit reyinyon',x.title,{required:true,full:true,placeholder:'Reyinyon òdinè Komite Direktè'})+field('type','Ògàn / kalite',x.type||'Komite Direktè',{options:['Komite Direktè','Asanble Jeneral','Komisyon Siveyans','Komisyon tematik','Reyinyon ekstraòdinè']})+field('date','Dat reyinyon',x.date||today(),{required:true,type:'date'})+field('location','Kote / mwayen reyinyon',x.location,{required:true})+field('noticeDate','Dat konvokasyon',x.noticeDate,{type:'date'})+field('expected','Manm ki gen dwa prezan',x.expected,{type:'number',min:0})+field('attendance','Manm prezan',x.attendance,{type:'number',min:0})+field('status','Estati',x.status||'Pwograme',{options:['Pwograme','Fèt','Anile']})+field('reference','Kòd PV / rezolisyon',x.reference,{full:true})+field('participants','Non manm prezan / lis prezans',x.participants,{area:true,full:true,hint:'Lis sa a konplete kantite prezan; PV siyen an rete referans final.'})+field('agenda','Pwen ajanda',x.agenda,{area:true,full:true})+field('decisions','Desizyon / aksyon swivi',x.decisions,{area:true,full:true,hint:'Presize responsab, dat limit ak rezilta vòt la nan PV ofisyèl la.'});formModal(i?'Revize reyinyon':'Planifye reyinyon APLS',body,'meetings',i)}
function openPayment(i){let x=getObj('payments',i);let body=field('flow','Direksyon lajan an',x.flow||'Antre',{options:['Antre','Sòti']})+field('category','Kategori',x.category||'Kotizasyon',{options:['Kotizasyon','Don','Kontribisyon','Sibvansyon','Depans pwojè','Acha / materyèl','Fonksyònman','Lòt']})+field('memberId','Manm (si sa aplikab)',x.memberId||'',{options:memberOptions(x.memberId,false)})+field('party','Moun / enstitisyon sous oswa destinatè',x.party||'',{placeholder:'Non moun / òganizasyon'})+field('amount','Montan',x.amount||'',{type:'number',step:'0.01',min:'0.01',required:true})+field('currency','Lajan',x.currency||'HTG',{options:['HTG','USD']})+field('date','Dat tranzaksyon an',x.date||today(),{type:'date',required:true})+field('status','Etap tranzaksyon',x.status||(x.flow==='Sòti'?'An atant':'Resevwa'),{options:['An atant','Apwouve','Peye','Resevwa','Anile']})+field('reference','Referans bank / prèv peman',x.reference||'',{full:true})+field('approver1','Premye moun ki apwouve (pou depans)',x.approver1||'')+field('approver2','Dezyèm moun ki apwouve (pou depans)',x.approver2||'')+field('notes','Deskripsyon / liy bidjè',x.notes||'',{area:true,full:true});formModal(i?'Modifye tranzaksyon':'Antre / depans ak resi',body,'payments',i)}
function openProject(i){let x=getObj('projects',i);let body=field('title','Non pwojè a',x.title,{required:true,full:true})+field('sector','Domèn devlopman',x.sector||SECTORS[0],{options:SECTORS,required:true})+field('location','Lokalite',x.location||'Lasal Sitwonye')+field('owner','Responsab pwojè',x.owner)+field('start','Dat kòmansman',x.start||today(),{type:'date'})+field('end','Dat finisman',x.end,{type:'date'})+field('budget','Bidjè prevwa',x.budget,{type:'number',step:'0.01',min:'0'})+field('currency','Lajan',x.currency||'HTG',{options:['HTG','USD']})+field('status','Estati',x.status||'Planifye',{options:['Planifye','An kou','Fini','Sispann','Anile']})+field('description','Bezwen, objektif, benefisyè ak endikatè rezilta',x.description,{area:true,full:true})+field('reference','PV / referans apwobasyon',x.reference,{full:true});formModal(i?'Revize pwojè':'Fich nouvo pwojè',body,'projects',i)}
function openAsset(i){let x=getObj('assets',i);let body=field('name','Deskripsyon byen',x.name,{required:true,full:true})+field('location','Kote byen an ye',x.location,{required:true})+field('owner','Moun ki responsab',x.owner)+field('value','Valè estime',x.value,{type:'number',min:'0',step:'0.01'})+field('currency','Lajan',x.currency||'HTG',{options:['HTG','USD']})+field('condition','Kondisyon',x.condition||'Bon',{options:['Bon','Pou repare','Andomaje','Pèdi','Retire']})+field('date','Dat anrejistreman',x.date||today(),{type:'date'})+field('notes','Nòt / seri / prèv acha',x.notes,{area:true,full:true});formModal(i?'Modifye byen':'Nouvo byen / envantè',body,'assets',i)}
function openElection(i){let x=getObj('elections',i);let body=field('title','Tit eleksyon',x.title,{required:true,full:true})+field('date','Dat eleksyon',x.date||today(),{type:'date',required:true})+field('position','Pòs / ògàn konsène',x.position)+field('owner','Komisyon elektoral / responsab',x.owner)+field('status','Estati',x.status||'Pwograme',{options:['Pwograme','An kou','Fini','Anile']})+field('reference','PV rezilta / kontestasyon',x.reference,{full:true})+field('notes','Kalandriye, kondisyon, avi, kontestasyon',x.notes,{area:true,full:true});formModal(i?'Modifye eleksyon':'Nouvo dosye eleksyon',body,'elections',i)}
function openComplaint(){let body=field('category','Kategori dosye tès','Plent sèvis',{options:['Plent sèvis','Konfli enterè','Etik','Demann rekou','Lòt']})+field('date','Dat',today(),{type:'date',required:true})+field('summary','Rezime jeneral san done sansib','',{area:true,full:true,required:true,hint:'Pa mete non, nimewo oswa detay ki ka idantifye moun.'})+field('owner','Moun ki gen responsabilite egzamen an','')+field('status','Estati','An egzamen',{options:['An atant','An egzamen','Fèmen']});formModal('Fich plent — TÈS SÈLMAN',body,'complaints',null)}
function openPartner(i){let x=getObj('partners',i);let body=field('name','Non òganizasyon / patnè',x.name,{required:true,full:true})+field('type','Kategori',x.type||'ONG',{options:['ONG','Enstitisyon leta','Asosyasyon','Donatè','Konpayi prive','Lòt']})+field('contact','Kontak ofisyèl',x.contact)+field('reference','Referans korespondans / akò',x.reference,{full:true})+field('status','Estati',x.status||'An atant',{options:['An atant','Aktif','Fèmen']})+field('notes','Objektif relasyon an',x.notes,{area:true,full:true});formModal(i?'Modifye patnè':'Ajoute yon patnè',body,'partners',i)}
function submitRecord(event){event.preventDefault();if(!pending)return;let kind=pending.kind,recordId=pending.recordId;let obj=Object.fromEntries(new FormData(event.target));let old=recordId?getObj(kind,recordId):{};
 if(kind==='members'){
  obj.consent=obj.consent==='yes';if(!obj.consent){notify('Konsantman nesesè pou enskripsyon sa a.',true);return}
  if(obj.status==='Aktif'&&(!obj.reference||!obj.reference.trim())){notify('Pou apwouve manm nan, mete referans PV/rezolisyon an.',true);return}
  obj.number=old.number||`APLS-${new Date().getFullYear()}-${String(db.members.length+1).padStart(4,'0')}`;
 }
 if(kind==='appointments'||kind==='oversight'){
  let m=getMember(obj.memberId);if(!m||m.status!=='Aktif'){notify('Chwazi yon manm aktif ki nan rejis manm yo.',true);return}
  if(obj.end<obj.start){notify('Dat fen manda a pa ka avan dat kòmansman.',true);return}
  if(kind==='oversight'&&db.appointments.some(x=>x.memberId===obj.memberId&&x.status==='Aktif')){notify('Manm Komisyon Siveyans pa ka fè pati Komite egzekitif la.',true);return}
  if(kind==='appointments'&&db.oversight.some(x=>x.memberId===obj.memberId&&x.status==='Aktif')){notify('Yon manm siveyans pa ka sèvi nan Komite egzekitif la.',true);return}
  if(kind==='appointments'&&db.appointments.some(x=>x.id!==recordId&&x.memberId===obj.memberId&&x.status==='Aktif')){notify('Manm sa a deja okipe yon lòt pòs egzekitif.',true);return}
  obj.memberName=fullName(m);obj.status='Aktif';
  if(kind==='appointments')db.appointments.filter(x=>x.position===obj.position&&x.id!==recordId&&x.status==='Aktif').forEach(x=>x.status='Fini');
  if(kind==='oversight'&&db.oversight.filter(x=>x.status==='Aktif').length>=3){notify('Modèl Komisyon Siveyans la limite a 3 manm.',true);return}
 }
 if(kind==='meetings'&&Number(obj.attendance||0)>Number(obj.expected||Infinity)){notify('Prezans pa ka depase kantite manm ki gen dwa prezan.',true);return}
 if(kind==='payments'){
  obj.amount=Number(obj.amount||0);if(obj.amount<=0){notify('Montan tranzaksyon an dwe pi gran pase zewo.',true);return}
  if(obj.memberId){let m=getMember(obj.memberId);if(m)obj.party=fullName(m)}
  if(obj.flow==='Sòti'){
   if(obj.status==='Resevwa'){notify('Pou depans, itilize An atant / Apwouve / Peye.',true);return}
   if(['Apwouve','Peye'].includes(obj.status)&&(!obj.approver1?.trim()||!obj.approver2?.trim()||obj.approver1.trim().toLowerCase()===obj.approver2.trim().toLowerCase())){notify('Depans apwouve yo mande 2 moun diferan pou verifikasyon.',true);return}
   if(obj.status==='Peye'&&!obj.reference.trim()){notify('Peman final mande yon referans prèv peman.',true);return}
  }else if(obj.status==='Peye'){obj.status='Resevwa'}
  obj.receipt=old.receipt||`APLS-${obj.flow==='Antre'?'R':'D'}-${new Date().getFullYear()}-${String(db.payments.length+1).padStart(4,'0')}`;
 }
 if(kind==='assets')obj.code=old.code||`APLS-B-${String(db.assets.length+1).padStart(4,'0')}`;
 if(kind==='complaints')obj.code=old.code||`APLS-P-${String(db.complaints.length+1).padStart(4,'0')}`;
 if(kind==='projects'&&obj.budget)obj.budget=Number(obj.budget);
 let x=assignRecord(kind,recordId,obj);
 if(kind==='appointments'&&old.id)db.appointments=db.appointments.filter(z=>z.id!==old.id||z.position===x.position);
 closeModal();save((recordId?'Mizajou':'Kreyasyon')+' nan '+kind+': '+(obj.title||obj.name||obj.memberName||fullName(obj)||obj.receipt||obj.code||''));notify('Dosye a anrejistre nan navigatè sa a')
}
function safeCsvCell(v){let s=String(v==null?'':v);if(/^[=+@\-\t\r]/.test(s))s="'"+s;return '"'+s.replace(/"/g,'""')+'"'}
function download(name,content,mime){const blob=new Blob([content],{type:mime});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000)}
function exportCsv(kind){let data=db[kind];if(!Array.isArray(data)||!data.length){notify('Pa gen done pou ekspòte nan seksyon sa a.',true);return}let headers=Array.from(new Set(data.flatMap(x=>Object.keys(x))));let content='\uFEFF'+headers.map(safeCsvCell).join(',')+'\r\n'+data.map(x=>headers.map(h=>safeCsvCell(x[h])).join(',')).join('\r\n');download('APLS_'+kind+'_'+today()+'.csv',content,'text/csv;charset=utf-8');notify('CSV a pare')}
function exportBackup(){download('APLS_sovgad_DEMO_'+today()+'.json',JSON.stringify({app:'APLS',version:'1.0-demo',exported:now(),data:db},null,2),'application/json');notify('Sovgad la telechaje. Pwoteje fichye sa a.')}
async function importBackup(input){let file=input.files?.[0];if(!file)return;try{let x=JSON.parse(await file.text());if(x.app!=='APLS'||!x.data||!Array.isArray(x.data.members)||!Array.isArray(x.data.payments))throw Error('Fòma sa a pa bon');if(!confirm('Sa pral ranplase done APLS ki sou navigatè sa a. Èske ou gen yon backup?'))return;let d=defaults();Object.keys(d).forEach(k=>{if(k in x.data)d[k]=k==='config'?{...d[k],...x.data[k]}:Array.isArray(x.data[k])?x.data[k]:d[k]});db=d;save('Backup APLS enpòte');notify('Backup la enpòte')}catch(e){notify('Fichye a pa yon backup APLS ki valab.',true)}finally{input.value=''}}
function printHtml(title,body){let html=`<!doctype html><html lang="ht"><head><meta charset="utf-8"><title>${esc(title)}</title><style>body{font-family:Arial,Helvetica,sans-serif;color:#183d2d;padding:42px;max-width:820px;margin:auto}h1{color:#0d4a37;font-size:25px}header{display:flex;align-items:center;gap:18px;border-bottom:3px solid #d6a33c;padding-bottom:20px;margin-bottom:28px}header img{width:84px;height:84px;object-fit:contain}.slogan{color:#84682c;margin:8px 0}.item{padding:13px 0;border-bottom:1px solid #dfe6df}small{color:#627165}.sign{display:flex;justify-content:space-between;margin-top:55px}.sign>div{border-top:1px solid #555;width:41%;padding-top:9px;font-size:12px}@media print{body{padding:15px}}</style></head><body><header><img src="${LOGO}"/><div><h1>APLS · ${esc(title)}</h1><div>Asosyasyon Peyizan Lasal Sitwonye</div><div class="slogan">Inyon • Solidarite • Devlopman</div><small>Lasal Sitwonye, 9yèm seksyon kominal Leyogàn, Ayiti</small></div></header>${body}<p style="margin-top:30px;font-size:11px;color:#758477">Fich administrasyon APLS · Enprime oswa sove kòm PDF · Nenpòt desizyon mande yon PV otorize.</p></body></html>`;let win=window.open('','_blank');if(!win){notify('Pèmèt fenèt pop-up la pou enprime fich la.',true);return}win.document.open();win.document.write(html);win.document.close();setTimeout(()=>{try{win.focus();win.print()}catch(e){}},550)}
function printBlankRegistration(){const labels=['Non fanmi','Prenon','Telefòn','Imèl (opsyonèl)','Lokalite / abitasyon','Adrès kontak (opsyonèl)','Aktivite / pwofesyon','Domèn enterè','Dat demann','Referans desizyon admisyon'];printHtml('Fòm enskripsyon manm (vid)',labels.map(k=>`<div class="item" style="min-height:46px"><b>${esc(k)}:</b> ______________________________________________</div>`).join('')+`<p style="font-size:12px;margin-top:20px">☐ Mwen dakò APLS itilize enfòmasyon mwen bay yo pou jesyon manm, nan respè règleman li yo ak politik vi prive li.</p><div class="sign"><div>Siyati kandida a</div><div>Siyati responsab enskripsyon</div></div>`)}

function openAnnex(letter){
 let conf=ANNEX_DATA[letter];if(!conf)return;
 let body=conf[1].map(([key,label,type])=>{
  if(type==='textarea')return field(key,label,'',{area:true,full:true});
  if(type.startsWith('select:'))return field(key,label,type.split(':')[1].split('|')[0],{options:type.split(':').slice(1).join(':').split('|')});
  if(type==='number'||type==='decimal')return field(key,label,'',{type:'number',min:0,step:type==='decimal'?'0.01':'1'});
  return field(key,label,'',{type:type==='date'?'date':'text'});
 }).join('');
 openModal(`Anèks ${esc(letter)} — ${esc(conf[0])}`,`<div class="notice">Fòm sa a pa bay otorizasyon ni pa reprezante siyati ofisyèl. Sèvi sèlman ak done fiktif pou teste.</div><form id="annexform" onsubmit="saveAnnex(event,'${letter}')"><div class="formgrid">${body}</div></form>`,`<button class="btn outline" onclick="closeModal()">Anile</button><button class="btn primary" type="submit" form="annexform">Anrejistre fòm</button>`);
}
function saveAnnex(e,letter){
 e.preventDefault();if(!ANNEX_DATA[letter])return;
 const fd=new FormData(e.target),values={};for(const [k,v] of fd)values[k]=String(v).trim().slice(0,4000);
 db.annexForms.push({id:id('ANEX'),letter,date:now(),values});closeModal();save(`Fòm anèks ${letter} anrejistre`);notify('Fòm nan anrejistre (DEMO)');
}
function printAnnex(idv){let x=db.annexForms.find(f=>f.id===idv);if(!x)return;let a=ANNEX_DATA[x.letter];
 const body=a[1].map(([key,label])=>`<div class="item"><b>${esc(label)}:</b> ${txt(x.values[key])}</div>`).join('')+`<p><small>Referans demonstrasyon: ${esc(x.id)} · ${esc(x.date)}</small></p><div class="sign"><div>Siyati orijinal lè dokiman an apwouve</div><div>Dat / Sekretarya</div></div>`;
 printHtml(`Anèks ${x.letter} — ${a[0]}`,body);
}
function printEmptyAnnex(letter){const a=ANNEX_DATA[letter];if(!a)return;printHtml(`Anèks ${letter} — ${a[0]}`,a[1].map(([k,label])=>`<div class="item" style="min-height:50px"><b>${esc(label)}:</b> _________________________________________</div>`).join('')+`<div class="sign"><div>Siyati ak dat</div><div>Verifikasyon</div></div>`)}
